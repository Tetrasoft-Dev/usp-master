name: Build and Publish usp-api

on:
  push:
    branches:
      - developer
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tetrasoft-dev/usp-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ghcr.io/tetrasoft-dev/usp-api:latest
            ghcr.io/tetrasoft-dev/usp-api:${{ github.sha }}

          secrets: |
            maven_username=${{ secrets.MAVEN_USERNAME }}
            maven_token=${{ secrets.MAVEN_TOKEN }}