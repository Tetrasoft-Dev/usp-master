name: Build and Publish usp-api

on:
  push:
    branches:
      - developer
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tetrasoft-dev/usp-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Maven settings.xml
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
        run: |
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"' \
            '          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"' \
            '          xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0' \
            '          https://maven.apache.org/xsd/settings-1.0.0.xsd">' \
            '  <servers>' \
            '    <server>' \
            '      <id>github</id>' \
            "      <username>${MAVEN_USERNAME}</username>" \
            "      <password>${MAVEN_TOKEN}</password>" \
            '    </server>' \
            '  </servers>' \
            '</settings>' \
            > maven-settings.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ghcr.io/tetrasoft-dev/usp-api:latest
            ghcr.io/tetrasoft-dev/usp-api:${{ github.sha }}

          secrets: |
            maven_settings=./maven-settings.xml
            maven_token=${{ secrets.MAVEN_TOKEN }}

      - name: Remove temporary Maven settings
        if: always()
        run: rm -f maven-settings.xml