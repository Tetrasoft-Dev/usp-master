services:
  # 1. Base de Dados PostgreSQL
  supabase-db:
    image: supabase/postgres:15.1.1.78
    container_name: supabase-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Serviço de Autenticação (GoTrue)
  supabase-auth:
    image: supabase/gotrue:v2.143.0
    container_name: supabase-auth
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}?sslmode=disable
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_SITE_URL: http://localhost:8080   # URL do Spring Boot
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
    ports:
      - "9999:9999"

  # 3. Painel Web de Gestão (Supabase Studio)
  supabase-studio:
    image: supabase/studio:latest
    container_name: supabase-studio
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      STUDIO_DEFAULT_ORGANIZATION: "Local Dev"
      STUDIO_DEFAULT_PROJECT: "Projeto Spring"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://localhost:${KONG_PORT}
    ports:
      - "${STUDIO_PORT}:3000"

volumes:
  supabase_db_data:
    driver: local
