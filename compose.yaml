services:
  # 1. Base de Dados PostgreSQL (Oficial Supabase)
  supabase-db:
    image: supabase/postgres:15.1.1.78
    container_name: supabase-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

 # 2. Postgres Meta (Atualizado para a versão estável recente)
  supabase-meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: supabase-meta
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: ${POSTGRES_USER}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_DB_PORT: 5432
    ports:
      - "8085:8080"

  # 3. Serviço de Autenticação (GoTrue)
  supabase-auth:
    image: supabase/gotrue:v2.143.0
    container_name: supabase-auth
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_API_EXTERNAL_URL: http://localhost:9999
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}?sslmode=disable
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_SITE_URL: http://localhost:8080   # URL do Spring Boot
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
    ports:
      - "9999:9999"

  # 4. Painel Web de Gestão (Supabase Studio)
  supabase-studio:
    image: supabase/studio:latest
    container_name: supabase-studio
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-meta:
        condition: service_started
    environment:
      STUDIO_DEFAULT_ORGANIZATION: "Local Dev"
      STUDIO_DEFAULT_PROJECT: "Projeto Spring"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB}
      SUPABASE_PUBLIC_URL: https://github.dev
      # CORREÇÃO: Adicione as duas linhas abaixo para o Studio localizar o Postgres
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: 5432
      # Comunicação direta via rede interna do Docker
      STUDIO_PG_META_URL: http://supabase-meta:8080
    ports:
      - "${STUDIO_PORT}:3000"

volumes:
  supabase_db_data:
    driver: local
